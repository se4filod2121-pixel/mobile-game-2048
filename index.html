<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2048" />
    <meta name="description" content="Kaydırarak oyna: sayıları birleştir, kapı kapı 1000 seviyeyi tamamla. Dokunmatik mobil oyun." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      />
    </noscript>

    <title>2048 — Mobil Oyun</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="title-group">
          <span class="title-badge">🎮</span>
          <h1 class="title">2048</h1>
        </div>
        <div class="chips">
          <div class="chip chip-gold" id="gold-chip" title="Altın">🪙 0</div>
          <div class="chip chip-joker" id="joker-chip" title="Oyun bitimini engelleyen joker">🃏 0</div>
        </div>
      </header>

      <section id="map-screen" class="screen">
        <div class="village-banner">
          <span class="village-icon" id="village-icon">🏘️</span>
          <div class="village-text">
            <h2 id="village-name">Ay Köyü</h2>
            <p id="village-sub">Seviye 1 • Kapı 1-20</p>
          </div>
          <button id="open-wheel" class="btn-overview btn-wheel" type="button" title="Şans Çarkı">🎡</button>
          <button id="open-overview" class="btn-overview" type="button" title="Tüm köyleri gör">🗺️</button>
        </div>
        <div class="map-scroll" id="map-scroll">
          <div id="map-forest" class="map-forest"></div>
          <svg id="map-svg" class="map-svg"></svg>
          <div id="map-path" class="map-path"></div>
          <div id="weather-fx" class="weather-fx" aria-hidden="true">
            <div class="weather-rain"></div>
            <div class="weather-fog">
              <span class="fog-blob fog-blob-1"></span>
              <span class="fog-blob fog-blob-2"></span>
              <span class="fog-blob fog-blob-3"></span>
            </div>
            <div class="weather-leaves">
              <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
              <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
              <span class="leaf"></span><span class="leaf"></span><span class="leaf"></span>
              <span class="leaf"></span>
            </div>
          </div>
        </div>
      </section>

      <div id="wheel-modal" class="modal-backdrop" hidden>
        <div class="wheel-modal-card">
          <button id="close-wheel" class="modal-close" type="button">✕</button>
          <h2>🎡 Şans Çarkı</h2>
          <p class="wheel-status" id="wheel-status">Günlük ücretsiz çevirişin hazır!</p>
          <div class="wheel-wrap">
            <div class="wheel-pointer">▼</div>
            <div class="wheel-disc" id="wheel-disc"></div>
            <div class="wheel-hub">🎁</div>
          </div>
          <button id="spin-wheel" class="btn btn-primary" type="button">Çevir!</button>
        </div>
      </div>

      <section id="overview-screen" class="screen" hidden>
        <div class="overview-header">
          <h2>🗺️ Yolculuk Haritası</h2>
          <button id="close-overview" class="btn btn-back" type="button">✕ Kapat</button>
        </div>
        <div class="overview-list" id="overview-list"></div>
      </section>

      <section id="board-screen" class="screen" hidden>
        <div class="board-topbar">
          <button id="back-to-map" class="btn btn-back" type="button">← Harita</button>
          <div class="chip" id="level-chip">Seviye 1</div>
        </div>

        <div class="progress-row">
          <div class="progress-labels">
            <span id="gate-label">Kapı 1 / 1000</span>
            <span class="progress-score" id="gate-score-label">0 / 160</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <div class="toolbar">
          <p class="hint">Aynı sayıdaki kutucukları kaydırarak birleştir, kapı hedefine ulaş!</p>
          <div class="toolbar-actions">
            <button id="undo-move" class="btn btn-undo" type="button" disabled>↩️ Geri Al (0)</button>
            <button id="new-game" class="btn" type="button">🔄 Kapıyı Yenile</button>
          </div>
        </div>

        <div class="board-wrap">
          <div class="board" id="board">
            <div class="grid-bg" id="grid-bg"></div>
            <div class="tiles" id="tiles"></div>
            <div class="overlay" id="overlay" hidden>
              <p class="overlay-message" id="overlay-message"></p>
              <div class="overlay-actions">
                <button id="overlay-primary" class="btn" type="button"></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="app-footer">
        <p>Dokunarak kaydır (mobil) veya ok tuşları / WASD (masaüstü) ile oyna.</p>
      </footer>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
